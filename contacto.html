<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Page metadata and global portfolio styles. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <!-- Local toast shown after a successful async form submission. -->
  <div id="toast">Mensaje enviado</div>

  <!-- Animated particle background shared across the portfolio. -->
  <div id="particles-bg"></div>

  <!-- Fixed bottom navigation used by every main page. -->
  <nav class="navbar" aria-label="Navegación principal">
    <a href="home.html" aria-label="Inicio">🏠</a>
    <a href="trayectoria.html" aria-label="Trayectoria">👤</a>
    <a href="proyectos.html" aria-label="Proyectos">💼</a>
    <a href="contacto.html" aria-label="Contacto">✉️</a>
  </nav>

  <h1 class="contact-title">Contacta conmigo</h1>

  <main class="contact-container">
    <!-- Contact form posted to FormSubmit and handled asynchronously by contact-form.js. -->
    <form id="contactForm" action="https://formsubmit.co/dmr.coding@protonmail.com" method="POST">
      <input type="text" name="nombre" placeholder="Nombre" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="text" name="asunto" placeholder="Asunto" required>
      <textarea name="mensaje" placeholder="Mensaje&#10;Cuéntame sobre tu proyecto u oferta..." required></textarea>

      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

      <button class="btn" type="submit">Enviar mensaje</button>
    </form>

    <!-- Contact details, availability and CV download. -->
    <aside class="contact-boxes" aria-label="Información de contacto">
      <div class="box">
        <h3>Información de contacto</h3>
        <p>Email: dmr.coding@protonmail.com</p>
        <p>Teléfono: +34</p>
        <p>Ubicación: Coslada (Madrid), España</p>
      </div>

      <div class="box">
        <h3>Disponibilidad</h3>
        <p>Lunes - Viernes: 8:00 - 17:00</p>
        <p class="response-time">Tiempo de respuesta: 24 - 48h</p>
      </div>

      <div class="box">
        <h3>Descarga mi CV</h3>
        <a class="btn" href="cv/CV_DanielMontero_2026.pdf">Descargar CV</a>
      </div>
    </aside>
  </main>

  <!-- External libraries and page behavior. -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <script src="js/particles-config.js"></script>
  <script src="js/contact-form.js"></script>
</body>
</html>
