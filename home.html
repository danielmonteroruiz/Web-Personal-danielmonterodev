<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Page metadata and global portfolio styles. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DanielMonteroCode</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="home-page">
  <!-- Animated particle background shared across the portfolio. -->
  <div id="particles-bg"></div>

  <!-- Fixed bottom navigation used by every main page. -->
  <nav class="navbar" aria-label="Navegación principal">
    <a href="home.html" aria-label="Inicio">🏠</a>
    <a href="trayectoria.html" aria-label="Trayectoria">👤</a>
    <a href="proyectos.html" aria-label="Proyectos">💼</a>
    <a href="contacto.html" aria-label="Contacto">✉️</a>
  </nav>

  <!-- Hero section with profile, animated specialization and main actions. -->
  <section class="home">
    <div class="profile">
      <img src="img/PERFIL.jpg" alt="Retrato de Daniel Montero Ruiz">
      <h3 class="profile-name">Daniel Montero Ruiz</h3>
    </div>

    <div class="home-content">
      <h1>Desarrollador Junior</h1>
      <h2>Especializado en</h2>
      <h2 class="typing" aria-live="polite"></h2>

      <p>
        Construyo aplicaciones modernas y eficientes para web, móvil y videojuegos.
      </p>

      <!-- Technology tags summarize the main stack at a glance. -->
      <div class="tags" aria-label="Tecnologías principales">
        <span>Java</span>
        <span>Kotlin</span>
        <span>PostgreSQL</span>
        <span>Spring Boot</span>
        <span>Docker</span>
        <span>Git</span>
      </div>

      <!-- Primary navigation calls to action. -->
      <div class="home-actions">
        <a class="btn" href="proyectos.html">Proyectos</a>
        <a class="btn" href="contacto.html">Contacto</a>
        <a class="btn" href="trayectoria.html">Trayectoria</a>
      </div>

      <!-- Visit counter loaded from CounterAPI and cached for the session. -->
      <div id="contador-box">
        👀 Visitas: <span id="contador">Cargando...</span>
      </div>
    </div>
  </section>

  <!-- External libraries and page behavior. -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <script src="js/particles-config.js"></script>
  <script src="js/typing.js"></script>
  <script src="js/contador.js"></script>
</body>
</html>
